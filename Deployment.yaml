apiVersion: apps/v1
kind: Deployment
metadata:
  name: depfile

spec:
  replicas: 2
  selector:
    matchLabels:
      app: depfile

  template:
    metadata:
      labels:
        app: depfile

    spec:
      containers:
        - name: depfile-container
          image: mrunal2804/aws-k8s:latest
          ports:
            - containerPort: 5000